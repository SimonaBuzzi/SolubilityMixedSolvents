package:
  name: solprop_ml_mix
  version: 1.0.2

source:
  path: ../

build:
    noarch: python
    number: '1'

requirements:
  host:
    - python >=3.9,<3.10
    - setuptools
    - numpy >=1.26,<2.0a0
    - memory_profiler
    - pip
    - typed-argument-parser ==1.7.0


  run:
    - python >=3.9,<3.10
    - matplotlib
    - numpy >=1.26,<2.0a0
    - pandas
    - pytorch >=2.5.0,<2.6.0 
    - rdkit
    - scikit-learn
    - tensorboardX
    - tqdm
    - coolprop
    - pip 
    - memory_profiler
    - typed-argument-parser ==1.7.0
 

test:
  imports:
    - solvation_predictor
    - solvation_predictor.data
    - solvation_predictor.features
    - solvation_predictor.models
    - solvation_predictor.solubility
    - solvation_predictor.train

about:
    home: https://gitlab.kuleuven.be/creas/vermeiregroup/SolProp_ML
